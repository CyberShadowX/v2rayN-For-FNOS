name: 源码检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: 配置 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: 安装构建依赖
        run: python -m pip install -r requirements-build.txt
      - name: 运行单元测试
        run: python -m unittest discover -s tests -v
      - name: 检查 Python 语法
        run: python -m compileall -q adapters runtime tools
      - name: 安装网页交互测试依赖
        run: npm install --no-save --package-lock=false playwright@1.61.1
      - name: 安装测试浏览器
        run: npx playwright install --with-deps chromium
      - name: 运行网页交互测试
        run: node --test tests/frontend.browser.test.cjs
