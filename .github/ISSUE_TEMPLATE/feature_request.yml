name: 功能建议
description: 描述希望解决的问题和使用场景
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题
      description: 说明具体使用场景，不要包含个人网络或认证资料
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述你希望如何操作、如何判断成功
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法与其他考虑
