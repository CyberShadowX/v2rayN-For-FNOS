<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">v2rayN For FNOS：飞牛原生桌面应用</title>
  <desc id="desc">公开预览版 1.0.5。保留原版图形界面，通过浏览器访问，支持 NAS 与 Docker 网络接管、上游更新和回滚。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1480" cy="60" r="240" fill="#2563eb" opacity="0.05"/>
  <circle cx="1110" cy="520" r="260" fill="#60a5fa" opacity="0.09"/>
